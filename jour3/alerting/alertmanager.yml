# Jour 3, TP C — alertmanager/alertmanager.yml, prêt à l'emploi
#
# Copier :    cp jour3/alerting/alertmanager.yml alertmanager/alertmanager.yml
# Valider :   ./lab.sh check
# Recharger : ./lab.sh reload
# Tester le routage sans rien casser :
#   docker compose exec alertmanager amtool config routes test severity=critical team=boutique
#
# Où arrivent les notifications :
#   Teams  -> l'adresse du fichier alertmanager/secrets/teams_url
#             (au départ l'Inbox du lab ; ./jour3.sh teams <URL> pour un vrai canal Teams)
#   Slack  -> l'Inbox du lab, http://localhost:8080
#   E-mail -> Mailpit, http://localhost:8025

global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

# L'arbre de routage : chaque alerte entre par la racine et descend dans la première branche
# dont les matchers correspondent (ou dans plusieurs si continue: true).
route:
  receiver: inbox-default          # si aucune branche ne correspond
  group_by: ["alertname", "job"]   # une notification par alerte et par job, pas par série
  group_wait: 10s                  # attendre 10 s pour grouper les alertes qui arrivent ensemble
  group_interval: 1m               # délai avant d'envoyer les nouveautés d'un groupe (dont « resolved »)
  repeat_interval: 4h              # rappel si l'alerte dure
  routes:
    # 1) Tout ce qui est critique part à l'astreinte, dans Teams... et on continue la descente
    - matchers:
        - severity = critical
      receiver: astreinte-teams
      continue: true

    # 2) L'équipe boutique reçoit ce qui la concerne dans Slack ET par e-mail
    - matchers:
        - team = boutique
      receiver: boutique

    # 3) L'infra reçoit ses alertes dans sa boîte
    - matchers:
        - team = infra
      receiver: infra-inbox

receivers:
  - name: inbox-default
    webhook_configs:
      - url: http://inbox:8080/webhook/default
        send_resolved: true

  # Microsoft Teams, méthode 2026 : un workflow Teams « Post to a channel when a webhook request
  # is received ». L'adresse est un secret : elle est dans un fichier, pas dans ce YAML.
  - name: astreinte-teams
    msteamsv2_configs:
      - webhook_url_file: /etc/alertmanager/secrets/teams_url
        send_resolved: true

  # Un receiver, deux canaux : Slack et e-mail
  - name: boutique
    slack_configs:
      - api_url: http://inbox:8080/slack/boutique
        channel: "#boutique-alertes"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ end }}
    email_configs:
      - to: equipe-boutique@boutique.local
        from: alertmanager@boutique.local
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true

  - name: infra-inbox
    webhook_configs:
      - url: http://inbox:8080/webhook/infra
        send_resolved: true

# TP C, partie 4 : les règles d'inhibition s'ajoutent ici
inhibit_rules: []
