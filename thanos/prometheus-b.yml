# Prometheus "site B" (TP 10) : mêmes cibles que le principal, autre réplica.
global:
  scrape_interval: 15s
  external_labels:
    cluster: formation
    replica: prom-2

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: shop-api
    static_configs:
      - targets: ["shop-api-1:5000", "shop-api-2:5000"]
        labels:
          env: formation
          team: boutique
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
