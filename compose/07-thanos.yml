# Brique 7 — Thanos (TP 10) : deux Prometheus avec sidecar, un "stockage objet", Store Gateway,
# Querier (vue globale + déduplication), Compactor.
#
# Prérequis : dans compose/01-prometheus.yml, activer les flags --storage.tsdb.*-block-duration=10m
# (des blocs de 10 minutes au lieu de 2 h, pour voir les envois pendant le TP).
#
# Le stockage objet est un simple dossier partagé (type FILESYSTEM dans thanos/objstore.yml).
# En production : S3, GCS, Azure Blob, OVH Object Storage...
x-thanos: &thanos
  image: quay.io/thanos/thanos:v0.42.4
  restart: unless-stopped
  user: root                        # lab uniquement : le volume partagé est créé par root
  networks: [monitoring]

services:
  # Sidecar du Prometheus principal : expose sa TSDB au Querier et envoie les blocs au bucket
  thanos-sidecar-a:
    <<: *thanos
    container_name: thanos-sidecar-a
    command:
      - sidecar
      - --prometheus.url=http://prometheus:9090
      - --tsdb.path=/prometheus
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - prometheus-data:/prometheus
      - ../thanos:/etc/thanos:ro
      - thanos-bucket:/bucket

  # Un second Prometheus ("site B", réplica prom-2) qui scrape les mêmes cibles
  prometheus-b:
    image: quay.io/prometheus/prometheus:v3.13.3
    container_name: prometheus-b
    restart: unless-stopped
    ports: ["9092:9090"]
    volumes:
      - ../thanos/prometheus-b.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-b-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.min-block-duration=10m
      - --storage.tsdb.max-block-duration=10m
      - --web.enable-lifecycle
    networks: [monitoring]

  thanos-sidecar-b:
    <<: *thanos
    container_name: thanos-sidecar-b
    command:
      - sidecar
      - --prometheus.url=http://prometheus-b:9090
      - --tsdb.path=/prometheus
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - prometheus-b-data:/prometheus
      - ../thanos:/etc/thanos:ro
      - thanos-bucket:/bucket

  # Lit les blocs du bucket pour servir l'historique
  thanos-store:
    <<: *thanos
    container_name: thanos-store
    command:
      - store
      - --data-dir=/data
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - ../thanos:/etc/thanos:ro
      - thanos-bucket:/bucket

  # Le point d'entrée : une API Prometheus qui interroge tout le monde et déduplique les réplicas
  thanos-query:
    <<: *thanos
    container_name: thanos-query
    ports: ["10902:10902"]
    command:
      - query
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --endpoint=thanos-sidecar-a:10901
      - --endpoint=thanos-sidecar-b:10901
      - --endpoint=thanos-store:10901
      - --query.replica-label=replica
      - --query.auto-downsampling

  # Compacte les blocs du bucket, applique la rétention, calcule les résolutions 5m / 1h
  thanos-compact:
    <<: *thanos
    container_name: thanos-compact
    command:
      - compact
      - --wait
      - --data-dir=/data
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --http-address=0.0.0.0:10902
      - --retention.resolution-raw=30d
      - --retention.resolution-5m=90d
      - --retention.resolution-1h=1y
    volumes:
      - ../thanos:/etc/thanos:ro
      - thanos-bucket:/bucket

volumes:
  prometheus-data:
  prometheus-b-data:
  thanos-bucket:

networks:
  monitoring:
    name: formation-monitoring
