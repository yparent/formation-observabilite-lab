# Brique 9 — Mailpit : un faux serveur de messagerie avec une interface web (jour 3, notifications)
#
# Grafana et l'Alertmanager envoient leurs e-mails à mailpit:1025 (SMTP, sans TLS).
# On lit les e-mails reçus sur http://localhost:8025, comme dans une vraie boîte mail.
# En production : le relais SMTP de l'entreprise (Exchange / Microsoft 365), avec TLS et authentification.
services:
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.27.11
    container_name: mailpit
    restart: unless-stopped
    ports: ["8025:8025"]
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks: [monitoring]

networks:
  monitoring:
    name: formation-monitoring
