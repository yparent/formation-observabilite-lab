# Brique 2 — Grafana, source de données et dashboard d'accueil provisionnés (exercice 1.7)
services:
  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    # Codespaces : sans ce lanceur, les panels d'un dashboard au titre accentué restent vides
    # (le proxy de GitHub refuse les en-têtes non-ASCII). Explication : grafana/codespaces/fix-headers.js
    entrypoint: ["sh", "/etc/grafana/codespaces/entrypoint.sh"]
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: formation
      # Codespaces : Grafana est ouvert via https://<codespace>-3000.app.github.dev. Sans cette ligne,
      # sa protection CSRF refuse les requêtes des panels (403 « origin not allowed ») : « No data » partout.
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: "${CODESPACE_NAME:-localhost}-3000.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # E-mails vers Mailpit (brique 09, jour 3). Sans la brique, l'envoi échoue simplement.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@boutique.local
      GF_SMTP_FROM_NAME: Grafana Formation
      GF_SMTP_SKIP_VERIFY: "true"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning   # datasources, dashboards, alerting
      - ../grafana/dashboards:/var/lib/grafana/dashboards   # les JSON "as code"
      - grafana-data:/var/lib/grafana                       # grafana.db
      - ../grafana/codespaces:/etc/grafana/codespaces:ro    # correctif Codespaces (voir plus haut)
    networks: [monitoring]

volumes:
  grafana-data:

networks:
  monitoring:
    name: formation-monitoring
