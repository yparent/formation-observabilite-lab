# Règles d'alerte — complétées progressivement pendant le Jour 3.
#
# Vérifier :  docker compose exec prometheus promtool check rules /etc/prometheus/rules/alerts.yml
# Tester   :  docker compose exec prometheus promtool test rules /etc/prometheus/tests/alerts_test.yml
# Recharger : curl -X POST http://localhost:9090/-/reload

groups:
  - name: disponibilite
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "La cible {{ $labels.instance }} (job {{ $labels.job }}) ne répond plus"
          description: "Prometheus n'arrive plus à collecter {{ $labels.instance }} depuis plus d'une minute."
