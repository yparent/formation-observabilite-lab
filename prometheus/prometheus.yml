# ---------------------------------------------------------------------------
# Configuration Prometheus du lab (version conteneur, à partir de l'exercice 1.7)
#
# Après chaque modification :
#   1. valider   : docker compose exec prometheus promtool check config /etc/prometheus/prometheus.yml
#   2. recharger : curl -X POST http://localhost:9090/-/reload
#
# Ce fichier grossit au fil des TP. Au départ, Prometheus ne surveille que lui-même.
# ---------------------------------------------------------------------------

global:
  scrape_interval: 15s        # fréquence de collecte par défaut
  evaluation_interval: 15s    # fréquence d'évaluation des règles (recording + alertes)
  external_labels:
    cluster: formation
    replica: prom-1

rule_files:
  - rules/*.yml

# Décommenté à l'exercice 3.0 (jour 3), quand la brique 06-alerting est active
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:

  # Prometheus se surveille lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- Jour 1 / TP 1 : job "node"          -> node-exporter:9100 ----------------
  # --- Jour 1 / TP 2 : job "shop-api"      -> shop-api-1:5000, shop-api-2:5000
  #                     job "redis"         -> redis-exporter:9121
  #                     job "blackbox-http" -> module http_2xx, relabeling vers blackbox-exporter:9115
  #                     job "pushgateway"   -> file_sd_configs sur targets/*.yml, honor_labels: true
  # ---------------------------------------------------------------------------
