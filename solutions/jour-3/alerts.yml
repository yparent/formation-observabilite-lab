# CORRIGÉ TP 6 / TP 7 — prometheus/rules/alerts.yml
groups:
  - name: disponibilite
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "La cible {{ $labels.instance }} (job {{ $labels.job }}) ne répond plus"
          description: "Prometheus n'arrive plus à collecter {{ $labels.instance }} depuis plus d'une minute."

      - alert: BlackboxProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sonde en échec : {{ $labels.instance }}"
          description: "Le blackbox exporter n'obtient plus de réponse valide de {{ $labels.instance }}."

  - name: shop-api
    rules:
      # Symptôme : le client subit des erreurs (taux 5xx > 5 % pendant 2 min)
      - alert: ShopHighErrorRate
        expr: |
          sum by (instance) (rate(http_requests_total{job="shop-api", status=~"5.."}[5m]))
          /
          sum by (instance) (rate(http_requests_total{job="shop-api"}[5m]))
          > 0.05
        for: 2m
        keep_firing_for: 3m
        labels:
          severity: critical
          team: boutique
        annotations:
          summary: "Taux d'erreur élevé sur {{ $labels.instance }}"
          description: "{{ $value | humanizePercentage }} des requêtes échouent (seuil 5 %)."
          runbook_url: "https://github.com/yparent/formation-observabilite-lab/blob/formation-2026/docs/runbooks/shop-errors.md"

      # Symptôme : le client attend (p95 > 1 s sur le checkout)
      - alert: ShopCheckoutSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="shop-api", route="/api/checkout"}[5m]))
          ) > 1
        for: 3m
        labels:
          severity: warning
          team: boutique
        annotations:
          summary: "Le paiement est lent (p95 = {{ $value | humanizeDuration }})"
          description: "95 % des paiements dépassent 1 s depuis 3 minutes."

      # Métier : plus aucune commande alors qu'il y a du trafic
      - alert: ShopNoOrders
        expr: |
          sum(rate(shop_orders_total[10m])) == 0
          and
          sum(rate(http_requests_total{job="shop-api"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
          team: boutique
        annotations:
          summary: "Plus aucune commande depuis 10 minutes malgré du trafic"
          description: "Le tunnel de commande est probablement cassé. Chiffre d'affaires à zéro."

      # Stock : rupture imminente
      - alert: ShopStockLow
        expr: shop_stock_units < 15
        for: 1m
        labels:
          severity: info
          team: logistique
        annotations:
          summary: "Stock faible : {{ $labels.product }} ({{ $value }} unités)"

  - name: infrastructure
    rules:
      # Cas pratique du programme : CPU élevé
      - alert: HostHighCpuLoad
        expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m]))) * 100 > 80
        for: 2m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "CPU à {{ $value | printf \"%.0f\" }} % sur {{ $labels.instance }}"
          description: "L'utilisation CPU dépasse 80 % depuis 2 minutes."

      - alert: HostOutOfMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Mémoire presque saturée sur {{ $labels.instance }}"

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.2
        for: 30m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Le disque {{ $labels.mountpoint }} sera plein dans moins de 24 h"

      - alert: BackupTooOld
        expr: time() - backup_last_success_timestamp_seconds > 24 * 3600
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Aucune sauvegarde réussie depuis plus de 24 h ({{ $labels.job }})"

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Le dernier rechargement de la configuration Prometheus a échoué"
