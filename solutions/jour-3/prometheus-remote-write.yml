# CORRIGÉ TP 9 — bloc à ajouter à la fin de prometheus/prometheus.yml
# puis : ./lab.sh longterm  &&  ./lab.sh reload

remote_write:
  - url: http://prometheus-longterm:9090/api/v1/write
    name: longterm
    remote_timeout: 30s
    # On n'envoie que ce qui a de la valeur sur le long terme : les métriques métier
    # et les recording rules (déjà agrégées). Le reste reste local (rétention 7 j).
    write_relabel_configs:
      - source_labels: [__name__]
        regex: "shop_.*|job:.*|instance:.*|route:.*|up"
        action: keep
    queue_config:
      capacity: 10000
      max_shards: 5
      max_samples_per_send: 2000
      batch_send_deadline: 5s
