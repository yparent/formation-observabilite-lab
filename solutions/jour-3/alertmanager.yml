# CORRIGÉ TP 6 / TP 7 — alertmanager/alertmanager.yml
global:
  resolve_timeout: 5m

# Modèles réutilisables (facultatif)
templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: inbox-default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 1) Les critiques partent vers l'astreinte, sans attendre
    - matchers:
        - severity = critical
      receiver: astreinte-teams
      group_wait: 10s
      repeat_interval: 1h
      continue: true            # on continue à évaluer les routes suivantes

    # 2) L'équipe boutique reçoit tout ce qui la concerne dans son canal
    - matchers:
        - team = boutique
      receiver: boutique-slack

    # 3) Les infos sont regroupées et envoyées avec parcimonie
    - matchers:
        - severity = info
      receiver: inbox-default
      group_interval: 30m
      repeat_interval: 24h

    # 4) TP 7 : l'alerte CPU part dans Teams (via Workflows)
    - matchers:
        - alertname = HostHighCpuLoad
      receiver: astreinte-teams
      group_wait: 10s

    # 5) Le reste de l'infra hors heures ouvrées est mis en sourdine (bonus TP 6)
    - matchers:
        - team = infra
      receiver: infra-inbox
      mute_time_intervals: [nuit-et-weekend]

receivers:
  - name: inbox-default
    webhook_configs:
      - url: http://inbox:8080/webhook/default
        send_resolved: true

  - name: infra-inbox
    webhook_configs:
      - url: http://inbox:8080/webhook/infra
        send_resolved: true

  # Microsoft Teams via Workflows (Power Automate) : msteamsv2_configs
  # Remplacer l'URL par celle de votre flux "Post to a channel when a webhook request is received"
  - name: astreinte-teams
    msteamsv2_configs:
      - webhook_url: http://inbox:8080/teams/astreinte
        send_resolved: true
        title: '{{ template "msteamsv2.default.title" . }}'
        text: '{{ template "msteamsv2.default.text" . }}'

  # Slack (incoming webhook). En production : api_url_file pour ne pas commiter le secret.
  - name: boutique-slack
    slack_configs:
      - api_url: http://inbox:8080/slack/boutique
        channel: "#boutique-alertes"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}• {{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}
          {{ end }}

  # PagerDuty (Events API v2) — exemple, non utilisé dans le lab
  # - name: pagerduty-astreinte
  #   pagerduty_configs:
  #     - routing_key_file: /etc/alertmanager/secrets/pagerduty.key
  #       severity: '{{ .CommonLabels.severity }}'

inhibit_rules:
  # Si la cible est down, inutile de hurler aussi sur ses erreurs ou sa latence
  - source_matchers:
      - alertname = TargetDown
    target_matchers:
      - alertname =~ "ShopHighErrorRate|ShopCheckoutSlow"
    equal: ["instance"]

  # Une alerte critique masque le warning de même nom sur la même instance
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ["alertname", "instance"]

time_intervals:
  - name: nuit-et-weekend
    time_intervals:
      - weekdays: ["saturday", "sunday"]
      - times:
          - start_time: "00:00"
            end_time: "08:00"
          - start_time: "20:00"
            end_time: "24:00"
        location: "Europe/Paris"
