# Jour 1 terminé : prometheus.yml avec les six jobs
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: formation
    replica: prom-1

rule_files:
  - rules/*.yml

# Alertes envoyées à l'Alertmanager (brique 06), activé par le rattrapage du jeudi
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: shop-api
    static_configs:
      - targets: ["shop-api-1:5000", "shop-api-2:5000"]
        labels:
          env: formation
          team: boutique

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # TP 2 — exporter tiers
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # TP 2 partie 5 — Pushgateway par découverte de fichier (targets/pushgateway.yml).
  # honor_labels garde le job/instance poussés par le batch.
  - job_name: pushgateway
    honor_labels: true
    file_sd_configs:
      - files: ["targets/*.yml"]
        refresh_interval: 30s

  # TP 2 — sondes Blackbox : la cible réelle passe en paramètre "target",
  # et l'adresse scrapée est réécrite vers l'exporter.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://shop-api-1:5000/health
          - http://shop-api-2:5000/health
          - http://grafana:3000/api/health
          - https://prometheus.io
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Exercice 1.8 (bonus) : relabeling — on retire les métriques internes du Node Exporter.
  # À retirer après la comparaison : deux jobs sur la même cible dupliquent toutes les séries
  # (et les dashboards du jour 2 afficheraient tout en double).
  # - job_name: node-light
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
  #   metric_relabel_configs:
  #     - source_labels: [__name__]
  #       regex: "go_.*|process_.*|promhttp_.*"
  #       action: drop
